name: Bootstrap CI
on:
  push:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
  compose:
    runs-on: ubuntu-24.04
    needs: [web, backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Generate isolated CI passwords
        shell: pwsh
        run: ./infra/scripts/init-env.ps1
      - name: Validate Compose
        run: docker compose --env-file .env -f infra/compose.yaml config --quiet
      - name: Build and start all four components
        run: docker compose --env-file .env -f infra/compose.yaml up --build --wait --wait-timeout 240
      - run: node infra/scripts/smoke-compose.mjs
      - name: Verify migration histories and schema-role separation
        run: |
          docker compose --env-file .env -f infra/compose.yaml exec -T postgres psql -U postgres -d campus -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF to_regclass('m1.flyway_schema_history') IS NULL OR to_regclass('m2.flyway_schema_history') IS NULL OR to_regclass('m3.flyway_schema_history') IS NULL THEN
              RAISE EXCEPTION 'Missing service migration history';
            END IF;
            IF has_schema_privilege('app_m1','m1','CREATE') OR has_schema_privilege('app_m1','m2','USAGE') OR has_schema_privilege('app_m2','m3','USAGE') OR has_schema_privilege('app_m3','m1','USAGE') THEN
              RAISE EXCEPTION 'Unexpected application database privilege';
            END IF;
          END $$;
          SQL
      - name: Capture failure diagnostics
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yaml logs --no-color --tail 150
      - name: Remove ephemeral CI resources
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down --volumes --remove-orphans
  required:
    name: bootstrap-required
    if: always()
    needs: [web, backend, compose]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every bootstrap job to execute successfully
        env:
          WEB: ${{ needs.web.result }}
          BACKEND: ${{ needs.backend.result }}
          COMPOSE: ${{ needs.compose.result }}
        run: test "$WEB" = success && test "$BACKEND" = success && test "$COMPOSE" = success
