name: Bootstrap CI
on:
  push:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
  g5-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: pj_dev
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pj_dev -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Disposable CI fixture only; never a deployment credential.
      DB_USERNAME: pj_dev
      DB_PASSWORD: ci-ephemeral-only
      DB_MIGRATION_USERNAME: pj_dev
      DB_MIGRATION_PASSWORD: ci-ephemeral-only
      PGPASSWORD: ci-ephemeral-only
      PSQL_BIN: /usr/bin/psql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Prepare isolated G5 databases
        run: python3 scripts/prepare-g5-ci.py
      - name: Real packaged-service PostgreSQL acceptance
        run: mvn -B -ntp -pl services/approval -am -Ppostgres-it verify
      - name: Check G5 provider contracts
        run: |
          python3 -m pip install -r scripts/requirements-contracts.txt
          python3 scripts/verify-auth-contracts.py
          python3 scripts/verify-config-contracts.py
          python3 scripts/verify-operation-contracts.py --responses services/approval/target/local-port-results.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install real browser
        run: npx playwright install --with-deps chromium
      - name: Real G5 browser regression
        run: npm run test:e2e --workspace apps/web
  auth-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: pj_dev
          POSTGRES_PASSWORD: ci-auth-ephemeral-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pj_dev -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      G6_AUTH_TEST_DB_USERNAME: pj_dev
      G6_AUTH_TEST_DB_PASSWORD: ci-auth-ephemeral-only
      PGPASSWORD: ci-auth-ephemeral-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 scripts/prepare-g6-auth-ci.py
      - name: Verify real G5 to reservation and maintenance authentication
        run: mvn -B -ntp -Pauth-it verify
      - name: Capture authentication failure diagnostics
        if: failure()
        run: cat tests/auth-acceptance/target/auth-it-logs/*.log
  compose:
    runs-on: ubuntu-24.04
    needs: [web, backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Generate isolated CI passwords
        shell: pwsh
        run: ./infra/scripts/init-env.ps1
      - name: Validate Compose
        run: docker compose --env-file .env -f infra/compose.yaml config --quiet
      - name: Build and start all four components
        run: docker compose --env-file .env -f infra/compose.yaml up --build --wait --wait-timeout 240
      - run: node infra/scripts/smoke-compose.mjs
      - name: Verify migration histories and schema-role separation
        run: |
          docker compose --env-file .env -f infra/compose.yaml exec -T postgres psql -U postgres -d campus -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF to_regclass('m1.flyway_schema_history') IS NULL OR to_regclass('m2.flyway_schema_history') IS NULL OR to_regclass('m3.flyway_schema_history') IS NULL THEN
              RAISE EXCEPTION 'Missing service migration history';
            END IF;
            IF has_schema_privilege('app_m1','m1','CREATE') OR has_schema_privilege('app_m1','m2','USAGE') OR has_schema_privilege('app_m2','m3','USAGE') OR has_schema_privilege('app_m3','m1','USAGE') THEN
              RAISE EXCEPTION 'Unexpected application database privilege';
            END IF;
          END $$;
          SQL
      - name: Capture failure diagnostics
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yaml logs --no-color --tail 150
      - name: Remove ephemeral CI resources
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down --volumes --remove-orphans
  required:
    name: bootstrap-required
    if: always()
    needs: [web, backend, compose, g5-validation, auth-integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every bootstrap job to execute successfully
        env:
          WEB: ${{ needs.web.result }}
          BACKEND: ${{ needs.backend.result }}
          COMPOSE: ${{ needs.compose.result }}
          G5: ${{ needs.g5-validation.result }}
          AUTH: ${{ needs.auth-integration.result }}
        run: test "$WEB" = success && test "$BACKEND" = success && test "$COMPOSE" = success && test "$G5" = success && test "$AUTH" = success
