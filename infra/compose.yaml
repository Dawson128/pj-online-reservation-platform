name: campus-dev
services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run infra/scripts/init-env.ps1}
      APP_M1_PASSWORD: ${APP_M1_PASSWORD:?Missing app password}
      MIGRATE_M1_PASSWORD: ${MIGRATE_M1_PASSWORD:?Missing migration password}
      APP_M2_PASSWORD: ${APP_M2_PASSWORD:?Missing app password}
      MIGRATE_M2_PASSWORD: ${MIGRATE_M2_PASSWORD:?Missing migration password}
      APP_M3_PASSWORD: ${APP_M3_PASSWORD:?Missing app password}
      MIGRATE_M3_PASSWORD: ${MIGRATE_M3_PASSWORD:?Missing migration password}

    volumes:
      - campus-db:/var/lib/postgresql/data
      - ./postgres/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  reservation:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: reservation
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/campus?currentSchema=m1
      DATABASE_PASSWORD: ${APP_M1_PASSWORD:?Missing app password}
      MIGRATION_PASSWORD: ${MIGRATE_M1_PASSWORD:?Missing migration password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081; printf \"GET /actuator/health/liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [backend]

  approval:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: approval
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/campus?currentSchema=m2
      DATABASE_PASSWORD: ${APP_M2_PASSWORD:?Missing app password}
      MIGRATION_PASSWORD: ${MIGRATE_M2_PASSWORD:?Missing migration password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082; printf \"GET /actuator/health/liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [backend]

  maintenance:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: maintenance
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8083
      DATABASE_URL: jdbc:postgresql://postgres:5432/campus?currentSchema=m3
      DATABASE_PASSWORD: ${APP_M3_PASSWORD:?Missing app password}
      MIGRATION_PASSWORD: ${MIGRATE_M3_PASSWORD:?Missing migration password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083; printf \"GET /actuator/health/liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [backend]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      reservation:
        condition: service_healthy
      approval:
        condition: service_healthy
      maintenance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [frontend, backend]

networks:
  frontend: {}
  backend:
    internal: true
volumes:
  campus-db: {}
