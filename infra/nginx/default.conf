server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location ~ ^/(internal|actuator)(/|$) { return 404; }
    location /api/m1/ { proxy_pass http://reservation:8081; include /etc/nginx/proxy_params_campus; }
    location /api/m2/ { proxy_pass http://approval:8082; include /etc/nginx/proxy_params_campus; }
    location /api/m3/ { proxy_pass http://maintenance:8083; include /etc/nginx/proxy_params_campus; }
    location /api/ { return 404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
