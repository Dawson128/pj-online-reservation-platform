spring.application.name=maintenance-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8083}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/campus?currentSchema=m3}
spring.datasource.username=${DATABASE_USERNAME:app_m3}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/campus?currentSchema=m3}
spring.flyway.user=${MIGRATION_USERNAME:migrate_m3}
spring.flyway.password=${MIGRATION_PASSWORD}
spring.flyway.default-schema=m3
spring.flyway.schemas=m3
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.validate-migration-naming=true
spring.sql.init.mode=never
spring.jackson.time-zone=Asia/Shanghai
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
