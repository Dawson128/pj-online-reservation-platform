spring.application.name=approval-service
server.address=${SERVER_ADDRESS:${APP_BIND_ADDRESS:127.0.0.1}}
server.port=${PORT:${APP_PORT:8082}}
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://127.0.0.1:5432/campus?currentSchema=m2}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:app_m2}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD}}
spring.flyway.url=${MIGRATION_DATABASE_URL:${DB_MIGRATION_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://127.0.0.1:5432/campus?currentSchema=m2}}}}
spring.flyway.user=${MIGRATION_USERNAME:${DB_MIGRATION_USERNAME:migrate_m2}}
spring.flyway.password=${MIGRATION_PASSWORD:${DB_MIGRATION_PASSWORD}}
spring.flyway.default-schema=m2
spring.flyway.schemas=m2
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.validate-migration-naming=true
spring.sql.init.mode=never
spring.jackson.time-zone=Asia/Shanghai
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.hikari.schema=m2
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful

#---
spring.config.activate.on-profile=!shell
management.server.port=${MANAGEMENT_PORT:18082}
management.server.address=127.0.0.1
