      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
            examples:
              success:
                value:
                  expectedVersion: '1'
                  reason: 检修完成，恢复开放
      responses:
        '200':
          description: 释放后的占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkClaim'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
