  # ==================== 内部接口 G4-I01—I08（C-I，服务凭据） ====================

  /internal/rooms/{id}:
    get:
      tags: [内部接口]
      operationId: G4-I01
      summary: 房间元数据核验（G2 / G3 → G4）
      description: |
        服务凭据 + 当前 X-Actor-Session。start/end 成对，APPLICATION 必须有。
        分别检查 room:apply 或 workorder:report + canAccessRoom，actor 绑定。
        不按占用过滤有效元数据；停用房间返回 room.enabled=false 供调用方拒绝新申请/报修。
        404 不存在、403 范围、503 鉴权不可用。
      security:
        - serviceCredential: []
          actorSession: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: actorUserId
          in: query
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [APPLICATION, REPORT]
        - name: start
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
        - name: end
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
      responses:
        '200':
          description: 房间与范围事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkRoomCheck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/rooms/{id}/scope-facts:
    get:
      tags: [内部接口]
      operationId: G4-I02
      summary: 单室范围事实（G5 → G4）
      description: |
        仅 G5 调用，**无用户会话**。
        NOTIFICATION_ROUTING 必须带 eventType/eventId；AUTHORIZATION 禁止这两个字段。
        返回 ScopeFacts，含停用历史房间。未知房间 404，读取 503 SCOPE_FACTS_UNAVAILABLE，
        用途/调用方错误 403。不调用 G5 内省，不检查用户业务范围，不返回身份资料。
        这是唯一后台范围事实链，**不得递归调用 G4-I01**。
      security:
        - serviceCredential: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [NOTIFICATION_ROUTING, AUTHORIZATION]
        - name: eventType
          in: query
          schema: {type: string, minLength: 1, maxLength: 80}
        - name: eventId
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: traceId
          in: query
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
      responses:
        '200':
          description: 范围事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkScopeFacts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/seats/{id}/reporting-metadata:
    get:
      tags: [内部接口]
      operationId: G4-I03
      summary: 报修座位元数据（G3 → G4）
      description: |
        服务凭据 + X-Actor-Session。只验证 workorder:report 与房座登记，
        不按占用/维修筛选。先核验 expectedRoomId 权限再比对 seat 归属；
        400 SEAT_ROOM_MISMATCH 且不泄露外室信息。404 未知、503 不核验不建工单。
      security:
        - serviceCredential: []
          actorSession: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: actorUserId
          in: query
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: expectedRoomId
          in: query
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [REPORT]
      responses:
        '200':
          description: 座位报修元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSeatReporting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/claims/{sourceType}/{sourceId}:
    put:
      tags: [内部接口]
      operationId: G4-I04
      summary: 建立或释放 WHOLE / REPAIR 占用（G2 / G3 → G4）
      description: |
        路径 sourceType 只接受 M2 或 M3，分别只允许 G2 或 G3 的服务身份。
        后台无用户会话。内部写用 operationId 与 sourceVersion 承担幂等，
        不要求 Idempotency-Key。

        M2 必须带 application 快照（ACTIVE 与 RELEASED 都用原不可变快照），M3 必须为 null。
        M3 的 ACTIVE start 由 G4 锁后当前时刻生成，end=null；M2 区间来自快照。
        RELEASED 只能释放同 sourceId，来源不存在也写墓碑。

        首次应用 200，重放返回原结果与原 HTTP 状态。
        确定 RESOURCE_CONFLICT 为 409；DEADLINE_PASSED / QUALIFICATION_REVOKED 为 422；
        两者都先在同房间/来源锁事务保存不可变拒绝结果与墓碑再返回，头 Operation-Recorded:true。
        503 表示无法确定，由原 operation 查询或重试。
      security:
        - serviceCredential: []
      parameters:
        - name: sourceType
          in: path
          required: true
          schema:
            type: string
            enum: [M2, M3]
        - name: sourceId
          in: path
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCommand'
      responses:
        '200':
          description: 台账命令结果
          headers:
            Operation-Recorded:
              schema: {type: boolean}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkClaimResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 资源冲突、旧版本、永久终态或快照不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 截止已过或资格撤销（同样先落墓碑再返回）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/claims/M2/{sourceId}/expire-if-not-approved:
    post:
      tags: [内部接口]
      operationId: G4-I05
      summary: 审批截止原子裁决（G2 → G4）
      description: |
        仅 G2 服务身份。同 room/source 锁内原子裁决，不需用户会话，不要求 Idempotency-Key。
        判定优先级：永久撤销/失效/冲突终态 → TERMINAL；deadline 前存在有效批准事实 →
        ALREADY_APPROVED；否则写 EXPIRED 墓碑 → EXPIRED。三种结果都持久化 operation。
        409 DEADLINE_NOT_REACHED / STALE_SOURCE_VERSION / SNAPSHOT_MISMATCH；
        503 不能证明终态。
      security:
        - serviceCredential: []
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpireIfNotApprovedRequest'
      responses:
        '200':
          description: 裁决结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkExpireOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/operations/{operationId}:
    get:
      tags: [内部接口]
      operationId: G4-I06
      summary: 查询台账裁决结果（G2 / G3 → G4）
      description: |
        query 为 Empty。返回 APPLIED 或 DECLINED 的裁决，DECLINED 保留原拒绝与终态。
        **消费者不得因 HTTP 200 就判为批准。**
        未提交 404 只表示"当前没有已提交结果"，不能当作永不到达证据，不触发释放。
        原调用服务不匹配 403。
      security:
        - serviceCredential: []
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
      responses:
        '200':
          description: 裁决结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkClaimAdjudication'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/claims/query:
    post:
      tags: [内部接口]
      operationId: G4-I07
      summary: 批量查询占用（G2 / G3 → G4）
      description: |
        只查自己的 M2 / M3 来源，最多 100 个 sourceId。
        不存在结果返回 result=null，不是成功批准。查询不建墓碑。
        按输入 ID 去重后逐项返回，无静默丢项。503 表示未知，需继续核验。
      security:
        - serviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimQueryRequest'
      responses:
        '200':
          description: 批量查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSourceClaims'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /internal/rooms/scope-facts/query:
    post:
      tags: [内部接口]
      operationId: G4-I08
      summary: 批量范围事实（G5 → G4）
      description: |
        仅 G5 服务身份、无用户会话。最多 100 个 roomId，去重后每个唯一 ID 一项，
        未知房间 facts=null，已停用历史房间仍有事实。单次本地只读事务一致快照。
        读取故障整批 503，调用方错误 403。不调用 G5 内省，避免循环。
      security:
        - serviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeFactsQueryRequest'
      responses:
        '200':
          description: 批量范围事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkScopeFactsBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        服务端会话 Cookie（Secure / HttpOnly / SameSite=Lax），绝对 8 小时，无刷新延长。
        同源写请求必须另带 X-CSRF-Token。
    serviceCredential:
      type: http
      scheme: bearer
      description: 服务间凭据，置于 Authorization 头。不得出现在 URL 中。
    actorSession:
      type: apiKey
      in: header
      name: X-Actor-Session
      description: 代用户调用时的会话标识，仅存请求内存，不落库。

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        $ref: '../common/resource-types.yaml#/components/schemas/Id'
    PageNumber:
      name: page
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      description: 页码，从 1 开始。越界时 items 为空但保留 total。
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '../common/resource-types.yaml#/components/schemas/Id'
      description: |
        对外写请求必需。作用域为 用户ID + method + 规范路径。
        同键同正文返回已持久结果，异正文 409 IDEMPOTENCY_CONFLICT。
        未知结果时只能用原键重试，不得自动换键。
        只读语义的 POST（G4-P06）不要求本头。
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 256}

  headers:
    IdempotencyReplayedFalse:
      description: 首次创建，未发生重放。
      schema: {type: boolean, enum: [false]}
    IdempotencyReplayedTrue:
      description: 同键同正文长效重放，返回原对象当前记录。
      schema: {type: boolean, enum: [true]}

  responses:
    BadRequest:
      description: 参数或正文校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: 参数校验失败
                traceId: '00000000-0000-4000-8000-000000000099'
                details:
                  fields: [{field: start, reason: 必须为整点}]
                  conflicts: []
                  currentVersion: null
                  operationId: null
                  retryAfterSeconds: null
    Unauthorized:
      description: 未登录或会话已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: 请重新登录
                traceId: '00000000-0000-4000-8000-000000000099'
                details:
                  fields: []
                  conflicts: []
                  currentVersion: null
                  operationId: null
                  retryAfterSeconds: null
    Forbidden:
      description: 无权限、超出范围或需要先改密码
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: 无权执行该操作
                traceId: '00000000-0000-4000-8000-000000000099'
                details:
                  fields: []
                  conflicts: []
                  currentVersion: null
                  operationId: null
                  retryAfterSeconds: null
    NotFound:
      description: 对象不存在或对当前用户不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                code: NOT_FOUND
                message: 对象不存在
                traceId: '00000000-0000-4000-8000-000000000099'
                details:
                  fields: []
                  conflicts: []
                  currentVersion: null
                  operationId: null
                  retryAfterSeconds: null
    Conflict:
      description: 版本、幂等、状态、资源或影响摘要冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              value:
                code: VERSION_CONFLICT
                message: 记录已变化，请刷新
                traceId: '00000000-0000-4000-8000-000000000099'
                details:
                  fields: []
                  conflicts: []
                  currentVersion: '2'
                  operationId: null
                  retryAfterSeconds: null
    ServiceUnavailable:
      description: 依赖不可用或事实无法核验，结果未知
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            dependencyUnavailable:
              value:
                code: DEPENDENCY_UNAVAILABLE
                message: 依赖服务暂不可用，请重试
                traceId: '00000000-0000-4000-8000-000000000099'
                details:
                  fields: []
                  conflicts: []
                  currentVersion: null
                  operationId: null
                  retryAfterSeconds: 5

  schemas:

    # ---------- 信封（x-pending-common: G6） ----------
    #
    # 成功信封统一为 Ok<T> = {data, traceId}。为便于阅读与校验，下面按 data 类型
    # 分别定义 OkXxx 具体模式（OpenAPI 3.1 无泛型）；G6 的公共定义落地后统一改为引用。

    ErrorCode:
      type: string
      description: |
        G4 会返回的错误码子集。全集由 G6 的公共错误约定维护，
        禁止出现未登记的 code。
      enum:
        - VALIDATION_ERROR
        - SEAT_ROOM_MISMATCH
        - UNAUTHENTICATED
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - NOT_FOUND
        - VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - STATE_CONFLICT
        - RESOURCE_CONFLICT
        - USER_TIME_CONFLICT
        - IMPACT_CHANGED
        - OPERATION_IN_PROGRESS
        - STALE_SOURCE_VERSION
        - SOURCE_TERMINAL
        - DEADLINE_NOT_REACHED
        - SNAPSHOT_MISMATCH
        - DUPLICATE_CODE
        - TIME_RULE_VIOLATION
        - QUALIFICATION_REVOKED
        - DEADLINE_PASSED
        - RATE_LIMITED
        - AUTH_UNAVAILABLE
        - SCOPE_FACTS_UNAVAILABLE
        - DEPENDENCY_UNAVAILABLE

    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: {type: string, minLength: 1, maxLength: 100}
        reason: {type: string, minLength: 1, maxLength: 200}

    ConflictItem:
      type: object
      additionalProperties: false
      required: [category, roomId, seatId, start, end]
      properties:
        category:
          $ref: '../common/resource-types.yaml#/components/schemas/UnavailableReason'
        roomId:
          $ref: '../common/resource-types.yaml#/components/schemas/Id'
        seatId:
          oneOf:
            - $ref: '../common/resource-types.yaml#/components/schemas/Id'
            - type: 'null'
        start:
          $ref: '../common/resource-types.yaml#/components/schemas/Time'
        end:
          oneOf:
            - $ref: '../common/resource-types.yaml#/components/schemas/Time'
            - type: 'null'

    ErrorDetails:
      type: object
      additionalProperties: false
      required: [fields, conflicts, currentVersion, operationId, retryAfterSeconds]
      properties:
        fields:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/FieldError'
        conflicts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConflictItem'
        currentVersion:
          oneOf:
            - $ref: '../common/resource-types.yaml#/components/schemas/Version'
            - type: 'null'
        operationId:
          oneOf:
            - $ref: '../common/resource-types.yaml#/components/schemas/Id'
            - type: 'null'
        retryAfterSeconds:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 3600
            - type: 'null'

    Error:
      type: object
      description: "完整错误体。x-pending-common: G6"
      x-pending-common: G6
      additionalProperties: false
      required: [code, message, traceId, details]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message: {type: string, minLength: 1, maxLength: 500}
        traceId:
          $ref: '../common/resource-types.yaml#/components/schemas/Id'
        details:
          $ref: '#/components/schemas/ErrorDetails'

    # ---------- 请求体 ----------

    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [code, name, location, area, type, capacity, schoolWide, deptId]
      properties:
        code: {type: string, minLength: 1, maxLength: 40}
        name: {type: string, minLength: 1, maxLength: 100}
        location: {type: string, minLength: 1, maxLength: 200}
        area: {type: string, minLength: 1, maxLength: 100}
        type:
          $ref: '../common/resource-types.yaml#/components/schemas/RoomType'
        capacity: {type: integer, minimum: 1, maximum: 10000}
        schoolWide: {type: boolean}
        deptId:
          oneOf:
            - $ref: '../common/resource-types.yaml#/components/schemas/Id'
            - type: 'null'

    UpdateRoomRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, values, impactToken]
      properties:
        expectedVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'
        values:
          $ref: '../common/resource-types.yaml#/components/schemas/RoomPatch'
        impactToken:
          $ref: '../common/resource-types.yaml#/components/schemas/Id'

    UpdateRoomResponse:
      type: object
      additionalProperties: false
      required: [room, impactOperationIds, affectedCount]
      properties:
        room:
          $ref: '../common/resource-types.yaml#/components/schemas/Room'
        impactOperationIds:
          type: array
          maxItems: 100
          items:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
          description: 影响超过 100 条时不枚举全部，改用 G4-P16b 按 sourceType/sourceId 关联查询。
        affectedCount: {type: integer, minimum: 0, maximum: 2147483647}

    CreateSeatRequest:
      type: object
      additionalProperties: false
      required: [code, socketType, expectedVersion]
      properties:
        code: {type: string, minLength: 1, maxLength: 40}
        socketType:
          $ref: '../common/resource-types.yaml#/components/schemas/Socket'
        expectedVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'

    UpdateSeatRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, roomVersion, values, impactToken]
      properties:
        expectedVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'
        roomVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'
        values:
          $ref: '../common/resource-types.yaml#/components/schemas/SeatPatch'
        impactToken:
          $ref: '../common/resource-types.yaml#/components/schemas/Id'

    ImpactPreviewRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, change]
      properties:
        expectedVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'
        change:
          $ref: '../common/resource-types.yaml#/components/schemas/ResourceChange'

    OpeningRulesRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, opening, impactToken]
      properties:
        expectedVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'
        opening:
          $ref: '../common/resource-types.yaml#/components/schemas/OpeningInput'
        impactToken:
          $ref: '../common/resource-types.yaml#/components/schemas/Id'

    RestrictionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, seatId, start, end, reason, impactToken]
      properties:
        expectedVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'
        seatId:
          oneOf:
            - $ref: '../common/resource-types.yaml#/components/schemas/Id'
            - type: 'null'
        start:
          $ref: '../common/resource-types.yaml#/components/schemas/Time'
        end:
          oneOf:
            - $ref: '../common/resource-types.yaml#/components/schemas/Time'
            - type: 'null'
        reason: {type: string, minLength: 1, maxLength: 1000}
        impactToken:
          $ref: '../common/resource-types.yaml#/components/schemas/Id'

    ReasonBody:
      type: object
      description: |
        带乐观并发的操作原因体。G4-P13 释放停用、G4-P16c 操作重试复用。
        expectedVersion 必填，缺失即丢失并发控制。
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion:
          $ref: '../common/resource-types.yaml#/components/schemas/Version'
        reason: {type: string, minLength: 1, maxLength: 1000}

    # ---------- 内部接口请求/响应 ----------

    ApplicationSnapshot:
      type: object
      description: 整室申请的不可变快照。ACTIVE 与 RELEASED 都使用原快照。
      additionalProperties: false
      required: [applicantId, start, end, deadline, attendeeCount, purpose, configVersion]
      properties:
        applicantId:
