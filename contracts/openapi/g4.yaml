      tags: [变更与影响预览]
      operationId: G4-P13
      summary: 解除管理员停用
      description: |
        只释放 ADMIN 本来源的占用，G4 写入释放时间。
        重复原键返回原结果；其他来源返回 403。
        不删除维修或占用产生的其他来源限制。body 为 ReasonBody（含 expectedVersion）。
