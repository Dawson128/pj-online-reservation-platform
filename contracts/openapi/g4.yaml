      tags: [运行与异常]
      operationId: G4-P16a
      summary: 查询单个操作（详情）
      description: |
        C-R，query 为 Empty。发起本人可读自己的业务操作，或 operation:read 同范围。
        statusUrl 是持久化的本域公开查询路径，不是进度动画地址。
