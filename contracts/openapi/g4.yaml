  /admin/operations:
    get:
      tags: [运行与异常]
      operationId: G4-P16b
      summary: 查询操作清单
      description: |
        C-R，需 operation:read 范围。
        按状态、时间、来源、房间、组别筛选分页，不需要预先知道操作编号。
        时间成对且 from<to、最长 31 天，未指定时间默认最近 7 天。
        **ownerGroup 必须属于本服务（m1 = G1/G4），否则 400。**
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OperationState'
        - name: needsAttention
          in: query
          schema: {type: boolean}
        - name: createdFrom
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
        - name: createdTo
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
        - name: sourceType
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/SourceType'
        - name: sourceId
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: roomId
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: ownerGroup
          in: query
          schema:
            type: string
            enum: [G1, G2, G3, G4, G5, G6]
          description: 本服务只接受 G1 与 G4，其余 400。
        - name: category
          in: query
          schema:
            type: string
            enum: [RESOURCE, NOTIFICATION_ROUTE, OTHER]
      responses:
        '200':
          description: 分页操作列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkPageOfOperation'
        '400':
          description: 参数非法（含 ownerGroup 不属于本服务）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ownerGroupOutOfService:
                  value:
                    code: VALIDATION_ERROR
                    message: ownerGroup 不属于本服务
                    traceId: '00000000-0000-4000-8000-000000000099'
                    details:
                      fields: [{field: ownerGroup, reason: 仅允许 G1、G4}]
                      conflicts: []
                      currentVersion: null
                      operationId: null
                      retryAfterSeconds: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/operations/{id}/retry:
    post:
      tags: [运行与异常]
      operationId: G4-P16c
      summary: 受控重试已受理的操作
      description: |
        C-W，需 operation:read + operation:recover 同范围，body 为 ReasonBody。
        只将 BLOCKED / RETRY_WAIT 的原操作重新排队，保持原 sourceVersion、期望状态
        与已受理决定；SUCCEEDED 或 RUNNING 返回 409 STATE_CONFLICT。
        权限变化不把原操作的恢复变成新业务批准。
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: 重试后的操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

