openapi: 3.1.0
info:
  title: G4 空间资源 — HTTP 契约
  version: 0.2.0
  description: |
    reservation-service 中 G4（空间资源）模块的完整 HTTP 契约，含对外接口与跨服务内部接口。

    G4 不产生业务，只裁决资源：回答"这个座位、这个时段能不能用，为什么不能用"。

    依据：技术文档 v2.0 §5.4（G4-P01—P18）、§5.6（P16 端点展开）、§5.7（G4-I01—I08）、
    §4.1—4.3（协议与类型）、§5.9（契约样例）、§7.1—7.4（事务与一致性）。

    传输形状（全部端点统一）：
    - 成功一律 `Ok<T> = {data: T, traceId: Id}`；异步受理为 `Ok<Pending<T>>`。
    - 失败一律完整 `Error = {code, message, traceId, details}`，不返回裸字符串。
    - 时间一律 RFC3339、+08:00、毫秒精度；区间为半开区间 [start, end)。
    - `V`（版本）以十进制字符串传输，避免浮点精度丢失。

    幂等与并发：
    - 对外写请求（POST/PATCH/PUT）必须携带 Idempotency-Key 与 X-CSRF-Token。
    - 只读语义的 POST（G4-P06 影响预览）不要求 Idempotency-Key，也不产生业务写效果。
    - 内部接口读请求不要求 Idempotency-Key；内部写以 operationId 或 eventId 承担幂等。
    - 所有更新必须携带 expectedVersion；不匹配返回 409 VERSION_CONFLICT。

    状态：draft —— 阶段 A 冻结评审通过后改为 frozen。
  contact:
    name: G4 空间资源
  license:
    name: 课程项目内部使用
    identifier: LicenseRef-Proprietary

x-contract:
  owner: G4
  baseline: 技术文档 v2.0
  reviewers_required: [G2, G3, G5, G6]
  reviewers_note: |
    公共资源类型需 G5、G6 与 G1/G2/G3 消费方分别评审。
    内部接口需对应调用方确认：G4-I01/I03 由 G2/G3 确认，G4-I02/I08 由 G5 确认，
    G4-I04/I05/I06/I07 由 G2/G3 确认。
  status: draft
  coverage_note: |
    样例覆盖：21 个对外操作与 8 个内部操作均给出完整成功样例（Ok 包裹、全部必填字段）；
    401/403/404/409/503 失败样例在 components/responses 中统一定义并被全端点复用；
    各端点特有失败（DUPLICATE_CODE、IMPACT_CHANGED、STATE_CONFLICT、ownerGroup 越界、
    unknown purpose 等）在对应响应上单独给出。T-CONTRACT 要求的三层样例（一成功 +
    一鉴权失败 + 一状态/输入失败）按此覆盖。
  open_questions:
    - id: Q1
      question: |
        G4-P12 的起止时刻早于受理时刻时，公开接口返回 400 VALIDATION_ERROR 还是
        422 TIME_RULE_VIOLATION，技术基线未明确。本版按 400 处理。
        注意：内部裁决的 422 已在 G4-I04 / G4-L12 覆盖（DEADLINE_PASSED、QUALIFICATION_REVOKED），
        两者不是同一层问题。
      blocks: G4-P12 的错误码
    - id: Q2
      question: |
        G4-L01 基线签名为 search(principal, query, kind): Page<RoomAvailability>|Page<SeatAvailability>，
        单一方法返回联合类型。Java 无法按 kind 重载返回类型，实现需用密封结果类型或两个适配方法。
        本版契约保留基线的单入口语义，实现方式的取舍需 G1 评审确认。
      blocks: G4-L01 的 Java 签名
    - id: Q3
      question: |
        EventEnvelope 与 Audit 由 G6 维护。本批事件 schema 内联了等价的信封结构并标注
        x-pending-common: G6，其公共定义落地后改为引用。
      blocks: contracts/events/g4/*.schema.json 的最终形状

servers:
  - url: /api/m1
    description: 网关转发路径。本地直连 reservation-service 使用 http://localhost:8081 的同一路径。

tags:
  - name: 房间与座位
    description: 主数据维护（G4-P01—P05、P09、P10）
  - name: 变更与影响预览
    description: 房内可用性写操作必须先预览再提交（G4-P06—P08、P11—P13）
  - name: 台账与追溯
    description: 占用来源追溯（G4-P14、P15）
  - name: 运行与异常
    description: 操作查询、重试与域指标（G4-P16a—d）
  - name: 供其他业务调用
    description: 报修选座与房间目录（G4-P17、P18）
  - name: 内部接口
    description: 跨服务调用（G4-I01—I08），服务凭据鉴权，非浏览器可达

security:
  - sessionCookie: []

paths:

  # ==================== 房间与座位主数据 ====================

  /admin/rooms:
    get:
      tags: [房间与座位]
      operationId: G4-P01
      summary: 管理端读取房间列表
      description: |
        返回停用与被占用对象，不套用学生可用性筛选。
        enabled 省略表示全部。只返回 room:manage 授权范围内的房间。
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema: {type: string, minLength: 1, maxLength: 100}
          description: 匹配编号 / 名称 / 地点。
        - name: enabled
          in: query
          schema: {type: boolean}
        - name: departmentId
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: type
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/RoomType'
      responses:
        '200':
          description: 分页房间列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkPageOfRoom'
              examples:
                success:
                  value:
                    data:
                      items:
                        - id: '00000000-0000-4000-8000-000000000010'
                          version: '1'
                          createdAt: '2026-10-24T08:00:00.000+08:00'
                          updatedAt: '2026-10-24T08:00:00.000+08:00'
                          code: R001
                          name: 示例教室
                          location: 教学楼1层
                          area: 东区
                          type: CLASSROOM
                          capacity: 2
                          schoolWide: true
                          deptId: null
                          enabled: true
                          opening:
                            weekly:
                              - {weekday: 6, start: '08:00', end: '22:00'}
                            exceptions: []
                            version: '1'
                          allowedActions: []
                      page: 1
                      pageSize: 20
                      total: 1
                      asOf: '2026-10-24T08:00:00.000+08:00'
                    traceId: '00000000-0000-4000-8000-000000000099'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [房间与座位]
      operationId: G4-P02
      summary: 新建房间
      description: |
        新建后 enabled=true、opening 为空、默认不开放（需另行配置开放规则）。
        新建权限按拟建归属匹配 room:manage 的 SCHOOL 或 DEPARTMENT 范围；
        尚不存在的 ID 不能利用任意 ROOM 授权新建。deptId 由 G5 验证院系有效性。

        幂等：首次创建返回 201 且 Idempotency-Replayed=false；
        24 小时内同键同正文重放返回 200 且 Idempotency-Replayed=true；
        缓存过期后仍先查创建意图索引，同摘要返回原对象当前记录并标注 Replayed，异摘要 409。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
            examples:
              success:
                value:
                  code: R002
                  name: 研讨室
                  location: 教学楼2层
                  area: 东区
                  type: CLASSROOM
                  capacity: 4
                  schoolWide: false
                  deptId: '00000000-0000-4000-8000-000000000030'
      responses:
        '201':
          description: 创建成功（首次）
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedFalse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkRoom'
              examples:
                success:
                  value:
                    data:
                      id: '00000000-0000-4000-8000-000000000010'
                      version: '1'
                      createdAt: '2026-10-24T08:00:00.000+08:00'
                      updatedAt: '2026-10-24T08:00:00.000+08:00'
                      code: R002
                      name: 研讨室
                      location: 教学楼2层
                      area: 东区
                      type: CLASSROOM
                      capacity: 4
                      schoolWide: false
                      deptId: '00000000-0000-4000-8000-000000000030'
                      enabled: true
                      opening: {weekly: [], exceptions: [], version: '1'}
                      allowedActions: []
                    traceId: '00000000-0000-4000-8000-000000000099'
        '200':
          description: 同键同正文长效重放，返回原对象当前记录
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedTrue'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkRoom'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 编号重复或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicateCode:
                  value:
                    code: DUPLICATE_CODE
                    message: 房间编号已存在
                    traceId: '00000000-0000-4000-8000-000000000099'
                    details:
                      fields: [{field: code, reason: 编号已被占用}]
                      conflicts: []
                      currentVersion: null
                      operationId: null
                      retryAfterSeconds: null
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/rooms/{id}:
    get:
      tags: [房间与座位]
      operationId: G4-P03
      summary: 读取单个房间详情
      description: 返回含完整 opening 的房间。管理详情不含他人预约身份。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 房间详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [变更与影响预览]
      operationId: G4-P08
      summary: 更新房间属性
      description: |
        必须先调用 G4-P06 取得 impactToken，body 的 values 必须与预览时的 change 正文一致，
        否则 409 IMPACT_CHANGED。

        权限：**归属变更必须同时覆盖旧范围与新范围**的 room:manage，否则 403；
        仅改名称等非归属属性只校验当前范围。

        事务内由协调器完成：G1 结算到期记录 → 系统取消受影响记录 →
        G4 变更房间并失效受影响 WHOLE → 写历史与 outbox，一次提交。

        停用即注销，历史保留；恢复不复活旧记录。任何属性变化统一走预览，不设隐含例外。
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
            examples:
              disable:
                value:
                  expectedVersion: '1'
                  values: {enabled: false}
                  impactToken: '00000000-0000-4000-8000-000000000030'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkUpdateRoom'
              examples:
                success:
                  value:
                    data:
                      room:
                        id: '00000000-0000-4000-8000-000000000010'
                        version: '2'
                        createdAt: '2026-10-24T08:00:00.000+08:00'
                        updatedAt: '2026-10-24T08:00:00.000+08:00'
                        code: R001
                        name: 示例教室
                        location: 教学楼1层
                        area: 东区
                        type: CLASSROOM
                        capacity: 2
                        schoolWide: true
                        deptId: null
                        enabled: false
                        opening:
                          weekly: [{weekday: 6, start: '08:00', end: '22:00'}]
                          exceptions: []
                          version: '1'
                        allowedActions: []
                      impactOperationIds: []
                      affectedCount: 0
                    traceId: '00000000-0000-4000-8000-000000000099'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 版本冲突或影响摘要变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                impactChanged:
                  value:
                    code: IMPACT_CHANGED
                    message: 影响范围已变化，请重新预览
                    traceId: '00000000-0000-4000-8000-000000000099'
                    details:
                      fields: []
                      conflicts: []
                      currentVersion: '2'
                      operationId: null
                      retryAfterSeconds: null
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/rooms/{id}/seats:
    post:
      tags: [房间与座位]
      operationId: G4-P09
      summary: 在房间下新增座位
      description: |
        新增座位 enabled=true。座位总数或有效座位数不受 capacity 限制，
        capacity 只用于整室申请人数校验。
        新座位继承房间当前的 WHOLE / REPAIR 限制，但不复制 claim 记录。
        幂等语义同 G4-P02。
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeatRequest'
            examples:
              success:
                value:
                  code: A02
                  socketType: NONE
                  expectedVersion: '1'
      responses:
        '201':
          description: 创建成功（首次）
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedFalse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSeat'
              examples:
                success:
                  value:
                    data:
                      id: '00000000-0000-4000-8000-000000000011'
                      version: '1'
                      createdAt: '2026-10-24T08:00:00.000+08:00'
                      updatedAt: '2026-10-24T08:00:00.000+08:00'
                      code: A02
                      roomId: '00000000-0000-4000-8000-000000000010'
                      roomVersion: '1'
                      socketType: NONE
                      enabled: true
                      reasons: []
                      allowedActions: []
                    traceId: '00000000-0000-4000-8000-000000000099'
        '200':
          description: 同键同正文长效重放
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedTrue'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSeat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/seats:
    get:
      tags: [房间与座位]
      operationId: G4-P04
      summary: 管理端读取座位列表
      description: |
        返回授权房间内的全部登记座位，包含停用与被占用座位（B.enabled=false 时仍包含 B）。
        roomId 必填。start/end 必须成对出现。
        未传区间时 reasons=[] 表示"未评估"，绝不表示可用。
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: roomId
          in: query
          required: true
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Id'
        - name: enabled
          in: query
          schema: {type: boolean}
        - name: seatCode
          in: query
          schema: {type: string, minLength: 1, maxLength: 40}
        - name: socketType
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Socket'
        - name: start
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
        - name: end
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
      responses:
        '200':
          description: 分页座位列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkPageOfSeat'
              examples:
                success:
                  value:
                    data:
                      items:
                        - id: '00000000-0000-4000-8000-000000000011'
                          version: '1'
                          createdAt: '2026-10-24T08:00:00.000+08:00'
                          updatedAt: '2026-10-24T08:00:00.000+08:00'
                          code: A01
                          roomId: '00000000-0000-4000-8000-000000000010'
                          roomVersion: '1'
                          socketType: FIXED
                          enabled: true
                          reasons: []
                          allowedActions: []
                      page: 1
                      pageSize: 20
                      total: 1
                      asOf: '2026-10-24T08:00:00.000+08:00'
                    traceId: '00000000-0000-4000-8000-000000000099'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/seats/{id}:
    get:
      tags: [房间与座位]
      operationId: G4-P05
      summary: 读取单个座位详情
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: start
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
        - name: end
          in: query
          schema:
            $ref: '../common/resource-types.yaml#/components/schemas/Time'
      responses:
        '200':
          description: 座位详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSeat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [变更与影响预览]
      operationId: G4-P10
      summary: 更新座位属性
      description: |
        只能修改 socketType 与 enabled，不能改编号、不能迁室。
        需携带 roomVersion 与 impactToken，按与房间相同的预览/取消协议执行。
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSeatRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSeat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ==================== 变更与影响预览 ====================

  /admin/rooms/{id}/impact-preview:
    post:
      tags: [变更与影响预览]
      operationId: G4-P06
      summary: 生成影响预览
      description: |
        按 POST 提交，但**按只读语义处理**：不产生任何业务写效果、不占用资源、
        **不要求 Idempotency-Key**，也不产生 operationId。

        token 五分钟有效，绑定：操作者 + room.version + change 规范正文摘要 +
        受影响来源 ID/版本集合 + 访问资格快照。提交时锁内重算摘要，不一致 409 IMPACT_CHANGED。

        影响包含 PERSONAL 与 WHOLE 已批准台账；超过 100 条通过 G4-P07 分页取，
        响应本身不泄露他人身份。
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpactPreviewRequest'
            examples:
              roomUpdate:
                value:
                  expectedVersion: '1'
