      operationId: G4-P16d
      summary: 读取资源域运行指标
      description: |
        C-R，query 为 {roomId?}。
        operations 字段要求 operation:read；未获权限时该字段为 null，不返回 403。
        notifications 字段仅 m3 提供，本服务恒为 null 且**必填**。
        各数值与清单使用同一权限谓词、状态与时间范围，不能把未知当 0。
      parameters:
