  /admin/rooms/{id}/restrictions:
    post:
      tags: [变更与影响预览]
      operationId: G4-P12
      summary: 设置管理员停用
      description: |
        创建 ADMIN 来源的占用。seatId 为 null 表示整间停用，非 null 表示单座停用。

        start 不早于当前受理时刻，不能倒填过去生效。
        若预览时 start 已过去，锁内允许提升为 now 并重算影响，变化则 409 IMPACT_CHANGED。
        end=null 表示无限期，直到显式释放；若有 end 必须大于 start。

        生效时刻与取消时机（易错）：
        - 停用起点在未来时，相交的未结束记录**仍立即整条系统取消**，
          不等到未来时点才取消。
        - 但维护影响的实际生效时刻使用**当前确认时刻**，不是未来的 start；
          违约判定按该生效时刻与签到截止比较。
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictionRequest'
            examples:
              wholeRoom:
                value:
                  expectedVersion: '1'
                  seatId: null
                  start: '2026-10-24T09:00:00.000+08:00'
                  end: null
                  reason: 空调检修
                  impactToken: '00000000-0000-4000-8000-000000000030'
      responses:
        '201':
          description: 创建成功（首次）
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedFalse'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkClaim'
        '200':
          description: 同键同正文长效重放
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedTrue'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkClaim'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

