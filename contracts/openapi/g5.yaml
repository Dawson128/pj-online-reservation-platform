        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
  schemas:
    Id:
      type: string
      format: uuid
    Version:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
    Principal:
      type: object
      additionalProperties: false
      required:
      - userId
      - displayName
      - deptId
      - accountVersion
      - permissionVersion
      - grants
      - mustChangePassword
      - expiresAt
      properties:
        userId:
          $ref: '#/components/schemas/Id'
