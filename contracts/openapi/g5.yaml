  responses:
    Identity:
      description: Current identity and actual role grants; mustChangePassword is false.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - data
            - traceId
            properties:
              data:
                $ref: '#/components/schemas/Principal'
              traceId:
                $ref: '#/components/schemas/Id'
    Invalid:
      description: 400 VALIDATION_ERROR, including unknown query/body fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 401 UNAUTHENTICATED for invalid credentials/session; no account-existence disclosure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 403 FORBIDDEN for invalid CSRF/service token; CURRENT_PASSWORD_INVALID for wrong current password.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 409 VERSION_CONFLICT; currentVersion is the current account version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Limited:
      description: 429 RATE_LIMITED, with Retry-After and retryAfterSeconds; 10 failed credentials in 5 minutes cause a 5-minute
        cooldown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 503 AUTH_UNAVAILABLE; no stale positive authorization fallback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
