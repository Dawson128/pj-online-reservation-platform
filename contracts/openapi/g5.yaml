          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - traceId
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
                  traceId:
                    $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - key
              - name
              - grants
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 60
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                grants: &id005
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - action
                    - scope
                    properties:
                      action:
                        type: string
                        minLength: 1
                        maxLength: 80
                      scope:
                        oneOf:
                        - type: object
                          additionalProperties: false
                          required:
                          - kind
                          properties:
                            kind:
                              const: SCHOOL
                        - type: object
                          additionalProperties: false
                          required:
                          - kind
                          properties:
                            kind:
                              const: SYSTEM
                        - type: object
                          additionalProperties: false
                          required:
                          - kind
                          - departmentId
                          properties:
                            kind:
                              const: DEPARTMENT
                            departmentId:
                              $ref: '#/components/schemas/Id'
                        - type: object
                          additionalProperties: false
                          required:
