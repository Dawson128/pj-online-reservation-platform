        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      - name: departmentId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: roleId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - traceId
                properties:
                  data:
                    $ref: '#/components/schemas/AccountPage'
                  traceId:
                    $ref: '#/components/schemas/Id'
        '400':
          description: 400 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 401 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 403 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 404 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 409 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 503 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: G5-P07
      security:
      - session: []
      description: Requires current system:manage grant in SYSTEM scope. Account changes revoke all target sessions; last
        effective administrator is protected.
      parameters:
      - $ref: '#/components/parameters/ManagementCsrf'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: &id001
                type: object
                additionalProperties: false
                required:
                - data
                - traceId
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
                  traceId:
                    $ref: '#/components/schemas/Id'
        '200':
          description: Idempotent replay; cached result within 24h, current created object after response expiry.
          content:
            application/json:
              schema: *id001
        '400':
          description: 400 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 401 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 403 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 404 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 409 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 503 management error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - userCode
              - displayName
              - departmentId
              - email
              - initialPassword
              - roleIds
              properties:
                userCode:
                  type: string
                  minLength: 1
                  maxLength: 40
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                departmentId:
                  $ref: '#/components/schemas/Id'
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
                  format: email
                initialPassword:
                  type: string
                  minLength: 8
                  maxLength: 24
                  writeOnly: true
                roleIds: &id006
                  type: array
                  items:
                    $ref: '#/components/schemas/Id'
                  maxItems: 50
