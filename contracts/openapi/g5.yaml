          type: string
          minLength: 1
          maxLength: 100
        deptId:
          $ref: '#/components/schemas/Id'
        accountVersion:
          $ref: '#/components/schemas/Version'
        permissionVersion:
          $ref: '#/components/schemas/Version'
        mustChangePassword:
          type: boolean
          const: false
          deprecated: true
          description: Compatibility field; mandatory first-password change is retired.
        expiresAt:
          type: string
          format: date-time
        grants: &id014
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - action
            - scope
            properties:
              action:
                type: string
                minLength: 1
                maxLength: 80
              scope:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - kind
                  properties:
                    kind:
                      const: SCHOOL
                - type: object
                  additionalProperties: false
                  required:
                  - kind
                  properties:
                    kind:
                      const: SYSTEM
                - type: object
                  additionalProperties: false
                  required:
                  - kind
