openapi: 3.1.0
info:
  title: G5 authentication and directory management API
  version: 0.8.0
  description: Implemented P01-P19, I01-I10 and L01/L02/L03/L06 provider logic. G5 scope, eligibility, candidate and notification
    policy use real current identity state; external G4 clients fail closed. Real G1-G4/G6 consumers, SMTP and cross-service
    business integration remain pending. G5-L04/L05/L07 and reliable G5-owned outbox delivery are provided; local operation
    DTOs live in contracts/local/g5-operations.schema.json; G6 receipt provider review remains pending.
paths:
  /api/m2/auth/login:
    post:
      operationId: G5-P01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - account
              - password
              properties:
                account:
                  type: string
                  minLength: 1
                  maxLength: 40
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  writeOnly: true
      responses:
        '200':
          description: Login accepted; Set-Cookie PJ_SESSION is Secure, HttpOnly, SameSite=Lax, Path=/, Max-Age=28800.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - traceId
                additionalProperties: false
                properties:
                  traceId:
                    $ref: '#/components/schemas/Id'
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - principal
                    - csrfToken
                    properties:
                      principal:
                        $ref: '#/components/schemas/Principal'
                      csrfToken:
                        type: string
                        minLength: 32
                        maxLength: 128
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/m2/auth/logout:
    post:
      operationId: G5-P02
      description: Valid sessions require X-CSRF-Token; missing/invalid/revoked sessions return success. Clear PJ_SESSION.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        $ref: '#/components/requestBodies/Empty'
      responses:
        '200':
          description: Session revoked or already absent; Set-Cookie clears the session.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - traceId
                properties:
                  traceId:
                    $ref: '#/components/schemas/Id'
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - revoked
                    properties:
                      revoked:
                        const: true
        '400':
          $ref: '#/components/responses/Invalid'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/m2/auth/me:
    get:
      operationId: G5-P03
      security:
      - session: []
      responses:
        '200':
          $ref: '#/components/responses/Identity'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/m2/auth/change-password:
    post:
      operationId: G5-P04
      description: Validate CSRF and current password; update account version and revoke every session atomically. No persistent
        idempotency key or password caching.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currentPassword
              - newPassword
              - expectedVersion
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 128
                  writeOnly: true
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 24
                  writeOnly: true
                expectedVersion:
                  $ref: '#/components/schemas/Version'
      responses:
        '200':
          description: Password changed, every old session revoked, cookie cleared; log in again.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - traceId
                properties:
                  traceId:
                    $ref: '#/components/schemas/Id'
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - passwordChanged
                    - reloginRequired
                    properties:
                      passwordChanged:
                        const: true
                      reloginRequired:
                        const: true
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/Limited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/auth/introspect:
    post:
      operationId: G5-I01
      description: G1/G3/G4/G6 each use a distinct service token. Principal includes current grants immediately after login;
        no mandatory first-password change. Not a public gateway route.
      security:
      - service: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - sessionToken
              properties:
                sessionToken:
                  type: string
                  minLength: 32
                  maxLength: 256
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/Identity'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/m2/admin/accounts:
    get:
      operationId: G5-P05
      security:
      - session: []
      description: Requires current system:manage grant in SYSTEM scope. Account changes revoke all target sessions; last
        effective administrator is protected.
      parameters:
