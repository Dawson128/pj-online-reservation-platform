      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 32
        maxLength: 128
    ManagementCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  requestBodies:
    Empty:
      required: true
