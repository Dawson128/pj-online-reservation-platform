      - session: []
      description: Requires SYSTEM/system:manage. Full grant replacement; key/builtIn immutable. Unknown action/scope/object
        400; unavailable G4 503 SCOPE_FACTS_UNAVAILABLE. Protect last administrator. Updates revoke all bound account sessions.
        Same-key replay precedes remote validation.
      parameters:
      - $ref: '#/components/parameters/ManagementCsrf'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Created
