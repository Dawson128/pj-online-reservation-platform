        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - &id003
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id004
